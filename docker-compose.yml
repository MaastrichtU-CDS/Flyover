# ══════════════════════════════════════════════════════════════════════
# Flyover stack
#
#   flyover          the application (Flask API + Vue SPA), defined below
#   rdf-store        a swappable RDF store backend, defined in stores/rdf/compose.yml
#                    and selected through COMPOSE_PROFILES (graphdb | rdf4j | qlever)
#   store-launcher   starts a store once a user chooses to work on it, defined
#                    in stores/launcher/compose.yml
#
# Every external module Flyover talks to lives in its own directory with its
# own compose file and is pulled in through `include:`. The app reaches each
# module by a stable hostname (e.g. "rdf-store") configured via one
# FLYOVER_<MODULE>_URL environment variable, so the app never needs to know
# which implementation is running behind that name.
#
# Quick start (GraphDB is the default profile, see .env):
#     docker compose create            # every container, none started yet
#     docker compose up -d flyover     # Flyover (and its store launcher)
# Flyover starts the store once a user chooses to work on it: a project whose
# map names it, or the standard RDF flow. `docker compose up -d` starts every
# store straight away, as before; `docker compose start rdf-store-graphdb`
# starts one without Flyover. A store that ran comes back after a restart.
#     COMPOSE_PROFILES=rdf4j docker compose create      # alternative store
# ══════════════════════════════════════════════════════════════════════

include:
  - stores/rdf/compose.yml
  - stores/launcher/compose.yml

services:
  flyover:
    image: ghcr.io/maastrichtu-cds/flyover-app:latest
    # If preferred, the image can be built from the Dockerfile in ./app
    # build:
    #   context: ./app
    container_name: flyover
    # NOTE: the hostname is used by the triplifier module as the base of the
    # generated RDF IRIs (http://data.local/rdf/...) and is hard-coded in the
    # SPARQL templates. Do not change it without updating those as well.
    hostname: data.local
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - store-launcher
    environment:
      - FLYOVER_RDF_STORE_URL=${FLYOVER_RDF_STORE_URL:-http://rdf-store:7200}
      # Starts the store above once a user chooses to work on it. Set it empty
      # when the store runs elsewhere: Flyover then takes it as running.
      - FLYOVER_STORE_LAUNCHER_URL=${FLYOVER_STORE_LAUNCHER_URL-http://store-launcher:7290}
      # Where users reach the same store: the port stores/rdf/compose.yml
      # publishes for rdf-store. Shown in the UI; the app uses the URL above.
      - FLYOVER_RDF_STORE_PUBLIC_URL=${FLYOVER_RDF_STORE_PUBLIC_URL:-http://localhost:7200}
      - FLYOVER_REPOSITORY_NAME=${FLYOVER_REPOSITORY_NAME:-userRepo}
      - FLASK_ENV=production
      # Enable manual materialization of inferred triples in a separate graph.
      # Set to true when the RDF store does not perform reasoning (RDF4J, QLever),
      # and to false when using GraphDB (which reasons natively).
      - FLYOVER_MATERIALIZE_INFERENCES=${FLYOVER_MATERIALIZE_INFERENCES:-true}
      # Mapping suggestions: comma list of enabled tiers (1 rule-based,
      # 2 embedding, 3 LLM). Empty disables the feature so the describe
      # pages render exactly as today.
      - FLYOVER_SUGGESTION_TIERS=${FLYOVER_SUGGESTION_TIERS-1}
      # Where model inference runs. "host" is the only mode wired so far;
      # "browser" is parsed and reported but a no-op for tier 1.
      - FLYOVER_SUGGESTION_COMPUTE=${FLYOVER_SUGGESTION_COMPUTE:-host}
      # Confidence below which an item escalates to the next tier.
      - FLYOVER_SUGGESTION_THRESHOLD=${FLYOVER_SUGGESTION_THRESHOLD:-0.8}
      # Optional: Override default timeout settings
      # - GUNICORN_TIMEOUT=300
      # - RDF_REQUEST_TIMEOUT=3600
    networks:
      - proxynet

networks:
  proxynet:
    name: flyover_network
