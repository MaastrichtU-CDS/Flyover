name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Python Unit, Integration and API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A throwaway PostgreSQL for the integration tests of the Postgres
    # ingest path (tests/integration/test_integration_ingest.py); they
    # skip when FLYOVER_TEST_POSTGRES_DSN is unset.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flyover
          POSTGRES_PASSWORD: flyover
          POSTGRES_DB: flyover
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyover"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLYOVER_TEST_POSTGRES_DSN: postgresql://flyover:flyover@localhost:5432/flyover

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/backend/requirements-test.txt
        # Install project dependencies
        if [ -f app/backend/requirements.txt ]; then pip install -r app/backend/requirements.txt; fi
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run unit tests
      id: unit-tests
      run: |
        echo "## 🧪 Unit Tests" >> $GITHUB_STEP_SUMMARY
        python -m pytest app/backend/data_descriptor/tests/unit/ \
          --tb=short \
          --junit-xml=unit-test-results.xml \
          --cov=app/backend/data_descriptor \
          --cov-config=app/backend/data_descriptor/.coveragerc \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml \
          -q 2>&1 | tee unit-test-output.txt
        EXIT_CODE=${PIPESTATUS[0]}
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -20 unit-test-output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        exit $EXIT_CODE
      continue-on-error: false

    - name: Run integration tests
      id: integration-tests
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🔗 Integration Tests" >> $GITHUB_STEP_SUMMARY
        python -m pytest app/backend/data_descriptor/tests/integration/ \
          --tb=short \
          --junit-xml=integration-test-results.xml \
          --cov=app/backend/data_descriptor \
          --cov-config=app/backend/data_descriptor/.coveragerc \
          --cov-append \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml \
          -q 2>&1 | tee integration-test-output.txt
        EXIT_CODE=${PIPESTATUS[0]}
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -20 integration-test-output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        exit $EXIT_CODE
      continue-on-error: false

    - name: Run API tests
      id: api-tests
      env:
        # Kept apart from the combined data until the gate below has read it.
        COVERAGE_FILE: .coverage.api
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🌐 API Tests" >> $GITHUB_STEP_SUMMARY
        python -m pytest app/backend/data_descriptor/tests/api/ \
          --tb=short \
          --junit-xml=api-test-results.xml \
          --cov=app/backend/data_descriptor \
          --cov-config=app/backend/data_descriptor/.coveragerc \
          --cov-report= \
          -q 2>&1 | tee api-test-output.txt
        EXIT_CODE=${PIPESTATUS[0]}
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -20 api-test-output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        exit $EXIT_CODE
      continue-on-error: false

    - name: API coverage of the HTTP layer (at least 90 %)
      id: api-coverage
      run: |
        # The API layer mocks the services, so its own bar is the HTTP layer:
        # the controllers, the app factory and the request-boundary helpers.
        python -m coverage report \
          --data-file=.coverage.api \
          --rcfile=app/backend/data_descriptor/.coveragerc \
          --include='*/data_descriptor/controllers/*,*/data_descriptor/app_factory.py,*/data_descriptor/utils/response_compression.py,*/data_descriptor/utils/mapping_request.py' \
          --show-missing \
          --fail-under=90 2>&1 | tee api-coverage.txt
        EXIT_CODE=${PIPESTATUS[0]}
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### API coverage of the HTTP layer" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat api-coverage.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        exit $EXIT_CODE
      continue-on-error: false

    - name: Combine coverage
      if: always()
      run: |
        if [ -f .coverage.api ]; then
          python -m coverage combine --append --keep \
            --rcfile=app/backend/data_descriptor/.coveragerc .coverage.api
        fi
        python -m coverage xml --rcfile=app/backend/data_descriptor/.coveragerc -o coverage.xml || true
      continue-on-error: true

    - name: Performance checks (non-blocking)
      id: perf-checks
      if: always()
      env:
        FLYOVER_PERF_REPORT: perf-report.md
      run: |
        # Timed without coverage, which would slow every request down.
        python -m pytest app/backend/data_descriptor/tests/perf/ -m perf \
          --tb=short \
          --junit-xml=perf-test-results.xml \
          -q 2>&1 | tee perf-test-output.txt
        EXIT_CODE=${PIPESTATUS[0]}
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## ⏱️ Performance Checks (non-blocking)" >> $GITHUB_STEP_SUMMARY
        if [ -f perf-report.md ]; then cat perf-report.md >> $GITHUB_STEP_SUMMARY; fi
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -5 perf-test-output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        exit $EXIT_CODE
      continue-on-error: true

    - name: Coverage report summary
      if: always()
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
        # Use the .coverage data file produced by the test step above
        python -m coverage report --rcfile=app/backend/data_descriptor/.coveragerc --show-missing 2>&1 | grep -E "^(TOTAL|app)" | head -30 > coverage-summary.txt || true
        if [ -s coverage-summary.txt ]; then
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "Coverage data not available." >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: |
          unit-test-results.xml
          unit-test-output.txt
          integration-test-results.xml
          integration-test-output.txt
          api-test-results.xml
          api-test-output.txt
          api-coverage.txt
          perf-test-results.xml
          perf-test-output.txt
          perf-report.md
          coverage.xml
        retention-days: 30

    - name: Unit Tests Summary
      if: always()
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "## 📋 Unit Tests Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test scope" >> $GITHUB_STEP_SUMMARY
        echo "- Unit tests from \`app/backend/data_descriptor/tests/unit/\` (path-based selection)" >> $GITHUB_STEP_SUMMARY
        echo "- Integration tests from \`app/backend/data_descriptor/tests/integration/\` (RDF store faked at the HTTP boundary)" >> $GITHUB_STEP_SUMMARY
        echo "- API tests from \`app/backend/data_descriptor/tests/api/\` (every route through the Flask test client, services mocked)" >> $GITHUB_STEP_SUMMARY
        echo "- Performance checks from \`app/backend/data_descriptor/tests/perf/\` (\`-m perf\`)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚫 Blocking (Will Fail Build)" >> $GITHUB_STEP_SUMMARY
        echo "- Any unit, integration or API test failure" >> $GITHUB_STEP_SUMMARY
        echo "- API coverage of the HTTP layer below 90 %" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ⚠️ Non-Blocking" >> $GITHUB_STEP_SUMMARY
        echo "- Performance checks (budgets and growth exponents; see their report above)" >> $GITHUB_STEP_SUMMARY
