name: Frontend E2E (Full)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, opened, synchronize, reopened]

jobs:
  e2e-full:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The whole suite against the default stack (tier 1 on).
          - name: Full Playwright suite against tmpfs stack
            key: full
            suggestion_tiers: '1'
            spec: ''
            expect_disabled: ''
          # The same stack started with FLYOVER_SUGGESTION_TIERS= (empty):
          # the describe pages must render exactly as before suggestions
          # existed. Only the disabled spec runs; E2E_SUGGESTIONS_DISABLED
          # makes it fail (instead of skip) if the flag did not reach the
          # container.
          - name: Suggestions disabled (FLYOVER_SUGGESTION_TIERS empty)
            key: suggestions-disabled
            suggestion_tiers: ''
            spec: tests/e2e/suggestions-disabled.spec.js
            expect_disabled: '1'
    # The CI test stack always runs against GraphDB; activate its profile for
    # every step so build, up, logs and teardown all target the right service.
    env:
      COMPOSE_PROFILES: graphdb
      FLYOVER_SUGGESTION_TIERS: ${{ matrix.suggestion_tiers }}
      E2E_SUGGESTIONS_DISABLED: ${{ matrix.expect_disabled }}
    # Only run on PRs if the run-full-e2e label is present. Always run on the
    # other triggers (schedule, dispatch).
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-full-e2e')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/frontend/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: app/frontend
        run: npx playwright install chromium

      - name: Install Playwright OS deps
        working-directory: app/frontend
        run: npx playwright install-deps chromium

      - name: Start stack (tmpfs)
        run: ./scripts/start-test-stack.sh

      - name: Run E2E suite
        working-directory: app/frontend
        run: npx playwright test ${{ matrix.spec }} --reporter=line

      - name: Capture docker logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            logs --no-color > docker-logs.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.key }}-${{ github.run_id }}
          path: |
            app/frontend/playwright-report/
            app/frontend/test-results/
            docker-logs.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
