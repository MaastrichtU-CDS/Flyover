name: Frontend Checks

on:
  push:
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

jobs:
  frontend-checks:
    name: Lint, type-check, unit tests with coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # Fails when coverage drops below the floors in vitest.config.js.
      - name: Unit tests, with coverage
        run: |
          npm run test:unit:coverage 2>&1 | tee unit-test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "## 🧪 Frontend unit tests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "Test Files|Tests |Statements|Branches|Functions|Lines|ERROR: Coverage" unit-test-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE

      - name: Build
        run: npm run build
